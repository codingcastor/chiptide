<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chiptide</title>
    <meta
      name="description"
      content="Live coding de musique NES dans le navigateur, avec les patterns de Strudel."
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>Chiptide</h1>
      <div class="controls">
        <button id="play" type="button" title="Évaluer et jouer (Ctrl+Entrée)">▶ Jouer</button>
        <button id="stop" type="button" title="Arrêter (Ctrl+.)">■ Stop</button>
        <select id="examples" aria-label="Exemples"></select>
        <label class="volume"
          >Volume <input id="volume" type="range" min="0" max="2" step="0.05" value="1"
        /></label>
      </div>
    </header>
    <main>
      <section class="editor-pane">
        <div id="editor"></div>
        <div id="status" role="status" aria-live="polite"></div>
      </section>
      <aside>
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="channels" aria-selected="true">Canaux</button>
          <button type="button" role="tab" data-tab="registers" aria-selected="false">Registres</button>
          <button type="button" role="tab" data-tab="help" aria-selected="false">Aide</button>
        </nav>
        <div class="tab-panel" data-panel="channels" role="tabpanel">
          <canvas id="scope" aria-label="Oscilloscope de la sortie"></canvas>
          <div id="scopes"></div>
        </div>
        <div class="tab-panel" data-panel="registers" role="tabpanel" hidden>
          <p class="hint">Les registres de la puce son, tels que le driver les écrit à chaque frame.</p>
          <div id="registers"></div>
        </div>
        <div class="tab-panel" data-panel="help" role="tabpanel" hidden>
          <p class="hint">
            Ctrl+Entrée joue, Ctrl+. arrête, Ctrl+Espace complète. Survolez une fonction pour voir son aide.
          </p>
          <div id="help"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
